<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hoarder</title>
  <script>
    try {
      var theme = localStorage.getItem("hoarder-theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=13" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="led" aria-hidden="true"></span>
        <h1>hoarder</h1>
      </div>
      <div class="topbar-actions">
        <p class="counts" id="counts">—</p>
        <div class="menu">
          <button type="button" class="icon-btn" id="settings" aria-label="Settings" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" fill-rule="evenodd" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.22-1.13.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.4 1.04.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.22 1.13-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
            </svg>
          </button>
          <div class="menu-panel" id="settings-menu" hidden>
            <label class="field">
              <span>Theme</span>
              <select id="theme">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="neon">Neon</option>
                <option value="rainbow">Rainbow</option>
              </select>
            </label>
            <label class="check">
              <input type="checkbox" id="hide-dupes" checked />
              Hide duplicate filenames
            </label>
            <button type="button" class="btn ghost" id="rescan">Rescan</button>
          </div>
        </div>
      </div>
    </header>

    <section class="panel" aria-label="Filters">
      <div class="filter-row">
        <label class="field grow">
          <span>Search</span>
          <input id="q" type="search" placeholder="name or folder" autocomplete="off" />
        </label>
      </div>
      <div class="tag-row">
        <span class="tag-label">Sample</span>
        <div class="sounds" id="roles" role="group" aria-label="Sample type"></div>
      </div>
      <div class="tag-row">
        <span class="tag-label">Genre</span>
        <div class="sounds" id="genres" role="group" aria-label="Genre"></div>
      </div>
      <div class="tag-row length">
        <span class="tag-label">Length</span>
        <div class="range">
          <div class="range-track"></div>
          <div class="range-fill" id="length-fill"></div>
          <input id="len-min" type="range" min="0" max="1000" step="1" value="0" aria-label="Minimum length" />
          <input id="len-max" type="range" min="0" max="1000" step="1" value="1000" aria-label="Maximum length" />
        </div>
        <output id="length-label">Any length</output>
        <label class="field key-field">
          <span>To key</span>
          <select id="target-key" aria-label="Pitch to key">
            <option value="">Original</option>
            <option>C</option>
            <option>C#</option>
            <option>D</option>
            <option>D#</option>
            <option>E</option>
            <option>F</option>
            <option>F#</option>
            <option>G</option>
            <option>G#</option>
            <option>A</option>
            <option>A#</option>
            <option>B</option>
          </select>
        </label>
        <span id="project-bpm" class="project-bpm" hidden></span>
      </div>
      <p class="hint">Click a genre twice to exclude it. Kick, then Dubstep again, leaves dubstep out. Files stay where they are. Drag a row into Ableton.</p>
    </section>

    <section class="panel player" aria-label="Preview">
      <div class="player-head">
        <button type="button" class="btn primary" id="play" disabled>Play</button>
        <div class="player-meta">
          <strong id="now-name">No sample selected</strong>
          <span class="dim" id="now-path"></span>
        </div>
        <span class="dur" id="now-time">0:00</span>
      </div>
      <div class="wave-wrap">
        <canvas id="wave" class="wave" height="72" aria-label="Waveform"></canvas>
        <div id="playhead" class="playhead" hidden></div>
      </div>
    </section>

    <section class="panel results" aria-label="Samples">
      <div class="results-bar" id="results-bar">
        <span id="result-count">—</span>
        <span class="dim" id="scan-note"></span>
      </div>
      <ul id="hits" class="hits"></ul>
      <div class="pager" id="pager">
        <button type="button" class="btn ghost" id="prev" disabled>Prev</button>
        <span id="page" class="dim"></span>
        <button type="button" class="btn ghost" id="next" disabled>Next</button>
      </div>
    </section>
  </div>
  <div id="file-menu" class="file-menu" hidden>
    <button type="button" id="open-explorer">Open in Explorer</button>
  </div>
  <audio id="audio" preload="auto"></audio>
  <script src="/static/app.js?v=15"></script>
</body>
</html>
